[project]
name = "stu-pytorch"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "matplotlib",
    "pillow",
    "requests",
    "torch",
    "torchvision",
]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [".venv", ".mypy_cache"]

[tool.ruff.lint]
# E4/E7/E9：常见代码风格和语法问题；F：未定义或未使用代码；
# I：import 排序；UP：现代 Python 写法；B：容易引发错误的代码模式。
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
